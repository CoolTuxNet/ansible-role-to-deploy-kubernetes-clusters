---
- name: Prepare all nodes
  hosts: kubeadm_cluster
  become: true
  roles:
    - ../roles/kubeadm_kubernetes/k8s_common

- name: Setup HA Virtual IP via Kube-VIP
  hosts: control_planes
  become: true
  tags: kube_vip
  roles:
    - ../roles/kubeadm_kubernetes/kube_vip

- name: Initialize the first control plane
  hosts: control_planes[0]
  become: true
  tags: control_plane_init
  roles:
    - ../roles/kubeadm_kubernetes/control_plane_init

- name: Join additional control planes
  hosts: control_planes[1:]
  become: true
  tags: control_plane_join
  roles:
    - ../roles/kubeadm_kubernetes/control_plane_join

- name: Join worker nodes
  hosts: workers
  become: true
  tags: worker_join
  roles:
    - ../roles/kubeadm_kubernetes/worker_join

- name: Install Network Plugin (CNI)
  hosts: control_planes[0]
  become: true
  tags: k8s_cni
  roles:
    - role: ../roles/kubeadm_kubernetes/calico_setup
      when: k8s_cni == 'calico'
      
    - role: ../roles/kubeadm_kubernetes/cilium_setup
      when: k8s_cni == 'cilium'   # Replaces Kube-Proxy

- name: Install Metrics Server
  hosts: control_planes[0]
  become: true
  tags: metrics_server
  roles:
    - ../roles/kubeadm_kubernetes/metrics_server