---
# Kubernetes
ansible_environment: production
k8s_major_version: "1.35"
k8s_version: "1.35.5"

### Netzwerk-Plugin
pod_network_cidr: "100.73.0.0/16"
service_network_cidr: "100.74.0.0/16"

### Kube-VIP HA Konfiguration
kube_vip_address: "10.6.8.210"

### Der k8s Endpoint zeigt nun direkt auf die VIP
control_plane_endpoint: "{{ kube_vip_address | default('10.6.8.210') }}:6443"

### Gewünschte Netzwerk
k8s_cni: "calico" # Entweder "cilium" oder "calico"
