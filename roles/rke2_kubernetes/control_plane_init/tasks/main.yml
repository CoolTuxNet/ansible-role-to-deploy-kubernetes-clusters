---
- name: Create RKE2 config directory
  file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Create server manifests directory
  file:
    path: /var/lib/rancher/rke2/server/manifests
    state: directory
    mode: "0755"

- name: Deploy RKE2 server configuration
  template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0644"

- name: Deploy Cilium HelmChartConfig
  template:
    src: rke2-cilium-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
    mode: "0644"
  when: cni_plugin == 'cilium'

- name: Deploy Calico HelmChartConfig
  template:
    src: rke2-calico-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-calico-config.yaml
    mode: "0644"
  when: cni_plugin == 'calico'

- name: Run RKE2 install script
  shell: curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION="{{ rke2_version }}" sh -
  args:
    creates: /usr/local/bin/rke2

- name: Enable and start rke2-server service
  systemd:
    name: rke2-server
    state: started
    enabled: true

- name: Configuration Cilium CNI
  block:
    - name: Wait for Cilium Operator to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        name: cilium-operator
        namespace: kube-system
        kubeconfig: /etc/rancher/rke2/rke2.yaml
      register: cilium_operator_info
      retries: 30
      delay: 10
      until:
        - cilium_operator_info.resources is defined
        - cilium_operator_info.resources | length > 0
        - cilium_operator_info.resources[0].status.readyReplicas is defined
        - (cilium_operator_info.resources[0].status.readyReplicas | default(0) | int) > 0

    - name: Wait for Cilium DaemonSet (Node Agents) to be ready
      become: true
      kubernetes.core.k8s_info:
        kind: DaemonSet
        name: cilium
        namespace: kube-system
        kubeconfig: /etc/rancher/rke2/rke2.yaml
      register: cilium_ds_info
      retries: 30
      delay: 10
      until:
        - cilium_ds_info.resources is defined
        - cilium_ds_info.resources | length > 0
        - cilium_ds_info.resources[0].status.numberReady is defined
        - cilium_ds_info.resources[0].status.desiredNumberScheduled is defined
        - (cilium_ds_info.resources[0].status.numberReady | default(0) | int) == (cilium_ds_info.resources[0].status.desiredNumberScheduled | default(0) | int)
        - (cilium_ds_info.resources[0].status.numberReady | default(0) | int) > 0

    - name: Template loadbalancerippool l2announcements manifest
      template:
        src: loadbalancerippool_l2announcementpolicy.yml.j2
        dest: /root/loadbalancerippool_l2announcementpolicy.yml
        owner: root
        group: root
        mode: "0600"

    - name: Apply LoadBalancerIPPool and L2AnnouncementPolicy
      kubernetes.core.k8s:
        state: present
        src: /root/loadbalancerippool_l2announcementpolicy.yml
        kubeconfig: /etc/rancher/rke2/rke2.yaml
  when: cni_plugin == 'cilium'
